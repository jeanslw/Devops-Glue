services:
  devops-glue:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-glue:latest
    container_name: devops-glue
    env_file:
      - .env
    volumes:
      - ./config/.env:/app/config/.env:ro
      - ./config/docker/nginx.conf:/etc/nginx/sites-available/default:ro
      - ./config/docker/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      - ./config/docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      #- ./config/data:/app/config/data
      - ./applog:/data/logs/ci-platform
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'php-fpm' /proc/*/comm 2>/dev/null && (test -S /run/php/php-fpm.sock || exec 3<>/dev/tcp/127.0.0.1/9000) || exit 1"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: devops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root123}
      MYSQL_DATABASE: ${DB_NAME:-devops_glue}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

# ──────────────────────────────────────
# Devops CD Service — 与 CI/MySQL 共用根目录 .env
# ──────────────────────────────────────
# 集中部署时取消下方注释即可。DB / Harbor / SECRET_KEY / CI_API_TOKEN 由 .env 注入；
# 镜像 Dockerfile 已内置 CMD（uvicorn 0.0.0.0:8081）与 HEALTHCHECK，无需在此重复。
# 单机单独部署 CD 时仍用 Devops_CD 仓库自带的 .env + docker compose up。
