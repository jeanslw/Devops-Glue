#    build:
#      context: ../Devops_CD
#      dockerfile: Dockerfile
#    container_name: devops-cd
#    image: devops-cd:latest
#    env_file:
#      - .env
#    environment:
#      CI_API_URL: http://devops-glue
#      SECRET_KEY: "${SECRET_KEY:?请先在根 .env 设置 SECRET_KEY（openssl rand -base64 32）再启用 devops-cd}"
#    ports:
#      - "8081:8081"
#    restart: unless-stopped
#    depends_on:
#      mysql:
#        condition: service_healthy

volumes:
  mysql-data:
