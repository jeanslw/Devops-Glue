# ──────────────────────────────────────
# Web 服务公共配置（YAML 锚点 &web-common）：供 devops-glue / devops-glue-web-2 / 后续副本复用，
# 新增副本只需一个 service 段 + `<<: *web-common` 一行继承全部公共项，避免复制 N 份。
# 运行时数据（/data/db、/data/cache、/data/backups）与日志挂同一宿主机路径 → 单机多副本天然共享；
# 跨主机（swarm/k8s）需改用共享存储，或把 OIDC 私钥放到 .env 的 OIDC_RSA_PRIVATE_KEY（见 app.env.example）。
# ──────────────────────────────────────
x-web-common: &web-common
  image: devops-glue:latest
  env_file:
    - .env
  environment:
    # 容器 OS + PHP date.timezone 共用；未设时默认上海。改根目录 .env 的 TZ 即可。
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - ./config/app.env:/app/config/app.env:ro
    - ./config/docker/nginx.conf:/etc/nginx/sites-available/default:ro
    - ./config/docker/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    - ./config/docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    # HTTPS 证书（想启用去掉注释；私钥只走挂载，不进镜像）
    # HTTPS certs (uncomment to enable; private key is mounted, never baked into the image)
    #- ./config/certs:/etc/nginx/certs:ro
    #- ./config/data:/app/config/data
    - ./logs/ci-platform:/data/logs/ci-platform
    # PHP 引擎层原生错误日志（php-error.log，fpm error_log + catch_workers_output）。
    # 与应用业务日志 app-*.log 分开；若无需在宿主机留存，可删除此行。
    - ./logs/php_log:/data/logs/php_log
    # 运行时数据持久化到宿主机（分类挂载，互不覆盖）：
    #   /data/db       — SQLite（DB_PATH=/data/db/data.db）。
    #   /data/cache    — OIDC 私钥 + GitLab ID 缓存。
    #   /data/backups  — 手动「备份数据库」生成的 zip 备份（devops-glue_<driver>_<datetime>.zip）。
    - ./data/db:/data/db
    - ./data/cache:/data/cache
    - ./data/backups:/data/backups
  restart: unless-stopped
  # 健康检查：
  #   1) nginx 在容器内 80 端口可接受 TCP 连接；
  #   2) php-fpm unix socket 存在（fpm 进程存活且监听就绪）。
  healthcheck:
    test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);' && test -S /run/php/php-fpm.sock"]
  depends_on:
    mysql:
      condition: service_healthy

services:
  devops-glue:
    <<: *web-common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-glue
    ports:
      - "8080:80"
      # HTTPS：想启用去掉注释，并在 nginx.conf 放开 443 listen 段、证书放 config/certs/
      # HTTPS: to enable, uncomment, un-comment the 443 listen block in nginx.conf, and put certs in config/certs/
      #- "8443:443"

  # ──────────────────────────────────────
  # Web 副本 #2（横向扩展模板）—— 默认注释。启用步骤：
  #   1) 注释掉上方 devops-glue 的 `ports: "8080:80"`（web 改为仅内部 80，由 front-nginx 统一入口）；
  #   2) 取消本段注释；
  #   3) 取消下方 front-nginx 段注释，并在 config/docker/nginx-lb.conf 的 upstream 里放开对应 server 行。
  # 再扩更多副本：复制本段改名（web-3…），同样 `<<: *web-common` 继承 + 加一行 upstream。
  # 数据卷已共享（见 x-web-common 顶部注释）；本副本无需宿主端口、无需 build。
  # devops-glue-web-2:
  #   <<: *web-common
  #   container_name: devops-glue-web-2

  # ──────────────────────────────────────
  # 定时任务 worker —— 与 Web 容器分离（分布式部署：web 层可水平扩展，定时任务单实例化）
  # ──────────────────────────────────────
  # 复用 devops-glue 镜像，不跑 nginx/php-fpm、不映射端口；只跑 tag 清理/回填两个 sleep-loop CLI。
  # 多实例部署时即使误起多份，CLI 内部的数据库租约锁（ci_cache）也保证同一时刻只有一个实例执行。
  # 默认启用：单机部署下与旧版行为一致（定时任务仍会跑，只是从 Web 容器挪到本容器）。
  devops-glue-worker:
    image: devops-glue:latest
    container_name: devops-glue-worker
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config/app.env:/app/config/app.env:ro
      - ./config/docker/supervisord-worker.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./logs/ci-platform:/data/logs/ci-platform
      - ./logs/php_log:/data/logs/php_log
      # 运行时数据与 Web 容器共享（分类挂载，互不覆盖）：
      #   /data/db       — SQLite（DB_PATH=/data/db/data.db），worker 与 Web 共用同一库文件。
      #   /data/cache    — OIDC 私钥 + GitLab ID 缓存。
      #   /data/backups  — 手动「备份数据库」生成的 zip 备份。
      - ./data/db:/data/db
      - ./data/cache:/data/cache
      - ./data/backups:/data/backups
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  # ──────────────────────────────────────
  # 前端负载均衡（多 web 副本统一入口）—— 默认注释。单实例部署不需要，devops-glue 直接映射 8080。
  # 启用步骤（配合 web 副本扩展）：
  #   1) 注释 devops-glue 的 `ports: "8080:80"` 行；
  #   2) 取消本段注释；
  #   3) 在 config/docker/nginx-lb.conf 的 upstream 里放开对应 server 行。
  # ⚠️ 反向代理会改写客户端 IP：需在根 .env 设 TRUSTED_PROXY_HOPS=1，
  #    否则登录失败锁桶 / 审计日志会记成 LB 内网 IP（而非真实客户端 IP）。
  # front-nginx:
  #   image: nginx:1.22-alpine
  #   container_name: devops-glue-lb
  #   volumes:
  #     - ./config/docker/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "8080:80"
  #   restart: unless-stopped
  #   depends_on:
  #     - devops-glue
  #     # - devops-glue-web-2

  # 启动前环境变量预检（一次性容器，复用 mysql 镜像不增加额外下载）：
  # 必填口令缺失时输出中英双语指引并以非零码退出，mysql / devops-glue 因依赖关系不会启动。
  # ⚠️ `docker compose up -d` 是分离模式，env-check 的双语指引被藏进容器日志，终端只显示 exit 1。
  #   想直接看原因，先跑 `docker compose run --rm env-check` 预检；若 up 已失败，用 `docker compose logs env-check` 回看提示。
  env-check:
    image: mysql:8.4
    entrypoint: ["sh", "-c"]
    restart: "no"
    volumes:
      # 挂载 config/ 用于预检 config/app.env 是否已创建（防止忘记 cp app.env.example app.env 时
      # bind mount 把 config/app.env 变成空目录导致启动 fatal）
      - ./config:/check:ro
    environment:
      DB_PASS: ${DB_PASS:-}
      DB_ROOT_PASS: ${DB_ROOT_PASS:-}
    command:
      - |
        fail=0
        if [ ! -f /check/app.env ]; then
          echo "[启动中止] 缺少 config/app.env：请先执行 cp config/app.env.example config/app.env 并填写配置（至少填一个 Git 平台的 URL 和 Token）"
          echo "[ABORT] Missing config/app.env: run 'cp config/app.env.example config/app.env' and fill it in first (at least one Git platform URL + token)"
          fail=1
        fi
        if [ -z "$$DB_PASS" ]; then
          echo "[启动中止] 缺少数据库业务账号口令：请在根目录 .env 设置 DB_PASS（业务账号 devops 连库口令，建议 openssl rand -base64 24）"
          echo "[ABORT] Missing database application password: set DB_PASS in the root .env (password for the application account 'devops'; suggested: openssl rand -base64 24)"
          fail=1
        fi
        if [ -z "$$DB_ROOT_PASS" ]; then
          echo "[启动中止] 缺少 MySQL 管理员口令：请在根目录 .env 设置 DB_ROOT_PASS（MySQL root 超级管理员口令，仅数据卷首次初始化时使用）"
          echo "[ABORT] Missing MySQL administrator password: set DB_ROOT_PASS in the root .env (MySQL root superuser password; used only on first-time volume initialization)"
          fail=1
        fi
        if [ "$$fail" = "1" ]; then
          echo "------------------------------------------------------------------------"
          echo "请补全根目录 .env 后重新执行 / Fill in the root .env, then run again: docker compose up -d --build"
          echo "提示 / Note: 升级存量 mysql-data 数据卷无需重建卷，手工建号 SQL 见本文件 mysql 服务注释。"
          echo "       Existing mysql-data volumes do not need rebuilding; see the manual SQL in the mysql service comments below."
          exit 1
        fi
        echo "[预检通过 / PASS] 数据库必填环境变量已配置 / Required database environment variables are set"

  mysql:
    image: mysql:8.4
    container_name: devops-mysql
    depends_on:
      env-check:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # root 与业务账号分离：CI/CD 应用以 MYSQL_USER 业务账号连库，不要用 root。。
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-}
      MYSQL_DATABASE: ${DB_NAME:-devops_glue}
      MYSQL_USER: ${DB_USER:-devops}
      MYSQL_PASSWORD: ${DB_PASS:-}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首启自动执行手工建表脚本（仅数据卷为空时执行一次；脚本均为幂等 IF NOT EXISTS）。
      - ./database/mysql_init.sql:/docker-entrypoint-initdb.d/01-ci.sql:ro
      # 联合部署 CD 时取消下一行注释（要求 Devops_CD 与本仓库为同级目录）：
      # - ../Devops_CD/database/init_mysql.sql:/docker-entrypoint-initdb.d/02-cd.sql:ro
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" --silent -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

# ──────────────────────────────────────
# Devops CD Service — 与 CI/MySQL 共用根目录 .env
# ──────────────────────────────────────
# 集中部署时取消下方注释即可。DB / Harbor / SECRET_KEY / CI_API_TOKEN 由 .env 注入；
# 镜像 Dockerfile 已内置 CMD（uvicorn 0.0.0.0:8081）与 HEALTHCHECK，无需在此重复。
# 单机单独部署 CD 时仍用 Devops_CD 仓库自带的 .env + docker compose up。
# ⚠️ 启用前必须先在根 .env 填写 SECRET_KEY（openssl rand -base64 32）：
#    下方 environment 的 ${SECRET_KEY:?} 会在留空时直接拒绝启动
#
#  devops-cd:
#    build:
#      context: ../Devops_CD
#      dockerfile: Dockerfile
#    container_name: devops-cd
#    image: devops-cd:latest
#    env_file:
#      - .env
#    environment:
#      TZ: ${TZ:-Asia/Shanghai}
#      CI_API_URL: http://devops-glue
#      SECRET_KEY: "${SECRET_KEY:?请先在根 .env 设置 SECRET_KEY（openssl rand -base64 32）再启用 devops-cd}"
#    ports:
#      - "8081:8081"
#    restart: unless-stopped
#    depends_on:
#      mysql:
#        condition: service_healthy

volumes:
  mysql-data:
