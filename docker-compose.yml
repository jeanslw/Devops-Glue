x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-web-common: &web-common
  image: devops-glue:latest
  env_file:
    - .env
  environment:
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - ./config/app.env:/app/config/app.env:ro
    - ./config/docker/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    - ./logs/ci-platform:/data/logs/ci-platform
    - ./data/db:/data/db
    - ./data/cache:/data/cache
    - ./data/backups:/data/backups
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    - KILL
  logging: *default-logging
  # php-fpm 端口存活
  healthcheck:
    test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);' && php /app/cli/healthcheck.php"]
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 60s
  depends_on:
    mysql:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: devops-glue-nginx
    volumes:
      - ./config/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      #- ./config/certs:/etc/nginx/certs:ro
      #- /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:80"
      #- "[::]:8080:80"
      #- "8443:443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy

  web:
    <<: *web-common
    build:
      context: .
      dockerfile: Dockerfile

  worker:
    image: devops-glue:latest
    container_name: devops-glue-worker
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config/app.env:/app/config/app.env:ro
      - ./config/docker/supervisord-worker.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./logs/ci-platform:/data/logs/ci-platform
      - ./data/db:/data/db
      - ./data/cache:/data/cache
      - ./data/backups:/data/backups
    command: ["supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy

  env-check:
    image: mysql:8.4
    entrypoint: ["sh", "-c"]
    restart: "no"
    volumes:
      - ./config:/check:ro
    environment:
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      DB_ROOT_PASS: ${DB_ROOT_PASS:-}
      DATA_ENC_KEY: ${DATA_ENC_KEY:-}
    command:
      - |
        fail=0
        if [ ! -f /check/app.env ]; then
          echo "[启动中止] 缺少 config/app.env：请先执行 cp config/app.env.example && config/app.env 并填写配置。"
          echo "[ABORT] Missing config/app.env: Please first run cp config/app.env.example && config/app.env and fill in the configuration."
          fail=1
        fi
        if [ -z "$$DB_USER" ]; then
          echo "[启动中止] 缺少数据库业务账号名：请在根目录 .env 设置 DB_USER"
          echo "[ABORT] Missing database application username: set DB_USER in the root .env"
          fail=1
        fi
        if [ -z "$$DB_PASS" ]; then
          echo "[启动中止] 缺少数据库业务账号口令：请在根目录 .env 设置 DB_PASS"
          echo "[ABORT] Missing database application password: set DB_PASS in the root .env"
          fail=1
        fi
        if [ -z "$$DB_ROOT_PASS" ]; then
          echo "[启动中止] 缺少 MySQL 管理员口令：请在根目录 .env 设置 DB_ROOT_PASS（仅数据卷首次初始化时使用）"
          echo "[ABORT] Missing MySQL administrator password: set DB_ROOT_PASS in the root .env (used only on first-time volume initialization)"
          fail=1
        fi
        key_ok=0
        if [ -n "$$DATA_ENC_KEY" ]; then key_ok=1; fi
        for f in /check/app.env /check/app.env.*; do
          [ -f "$$f" ] || continue
          grep -qE '^DATA_ENC_KEY=[[:space:]]*[^[:space:]]' "$$f" && key_ok=1
        done
        if [ "$$key_ok" != "1" ]; then
          echo '[启动中止] 缺少敏感字段加密密钥 DATA_ENC_KEY：请在 config/app.env 或根 .env 设置'
          echo '[ABORT] Missing sensitive-field encryption key DATA_ENC_KEY: set it in config/app.env or the root .env'
          fail=1
        fi
        if [ "$$fail" = "1" ]; then
          echo "------------------------------------------------------------------------"
          echo "Fill in the root .env, then run again: docker compose up -d --build"
          echo "提示 / Note: 升级存量 mysql-data 数据卷无需重建卷，手动迁移模式请启用mysql服务的SQL创建脚本"
          echo "Existing mysql-data volumes do not need rebuilding; For manual migration mode, please enable the SQL creation script of the MySQL service"
          exit 1
        fi
        echo "[预检通过 / PASS] 数据库环境变量已配置 / Database environment variables have been configured"

  mysql:
    image: mysql:8.4
    container_name: devops-mysql
    depends_on:
      env-check:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-}
      MYSQL_DATABASE: ${DB_NAME:-devops_glue}
      MYSQL_USER: ${DB_USER:-devops}
      MYSQL_PASSWORD: ${DB_PASS:-}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql_init.sql:/docker-entrypoint-initdb.d/01-ci.sql:ro
      # - ../Devops_CD/database/init_mysql.sql:/docker-entrypoint-initdb.d/02-cd.sql:ro
    restart: unless-stopped
    logging: *default-logging
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" --silent -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

