name: Security Check

on: [push, pull_request]

# 显式声明最小权限，避免 workflow 获得默认的 write-all 令牌
# 此 workflow 仅做本地只读检查（lint + grep 密钥扫描），无任何写入操作
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: PHP Lint
        run: |
          find . -name "*.php" -not -path "./vendor/*" | while read f; do
            php -l "$f" || exit 1
          done

      - name: Check Hardcoded Secrets
        run: |
          # 扫描所有已跟踪文件（含 .env / .env.example / *.yml / *.sh / Dockerfile）是否误提交真实凭证。
          # 用 git grep：只扫 .gitignore 之外的已提交文件，自动跳过 vendor、node_modules、
          # 以及本地真实配置 config/app.env、app.env.local —— 不再排除 .env。
          # glpat- 限定至少 8 位令牌串，避免误报文档里的占位符 glpat-xxxx；
          # 数字用 [x] 打断字面量，避免扫到本文件自身的模式定义。
          if git grep -nE "(glpat-[A-Za-z0-9_-]{8,}|116512539[2]|Admin1234[5])" -- .; then
            echo "❌ 发现硬编码的敏感信息！"
            exit 1
          fi
          echo "✅ 未发现敏感信息"
