name: Auto Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          tagRegex: "^v\\d+\\.\\d+\\.\\d+$"
          configurationJson: |
            {
              "categories": [
                {"title": "🚀 Features", "labels": ["feature", "enhancement"]},
                {"title": "🐛 Bug Fixes", "labels": ["bug", "fix"]},
                {"title": "🔧 Maintenance", "labels": ["chore", "refactor"]}
              ]
            }
          fromTag: ${{ github.event.before }}
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ matches(github.ref_name, '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)') }}
