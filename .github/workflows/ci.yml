name: CI Pipeline

on:
  push:
    branches: [main, 'release/**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # ✅ 正式版: v2.7.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'     # ✅ 预发布版: v2.7.0-beta
      - '[0-9]+.[0-9]+.[0-9]+'        # 兼容无v前缀
      - '[0-9]+.[0-9]+.[0-9]+-*'      # 兼容无v前缀预发布
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, pdo_mysql
          tools: composer:v2, phpstan

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.2-composer-

      - run: composer install --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHPStan Static Analysis
        run: phpstan analyse src/ --level=5 --memory-limit=512M

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: Security Audit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            composer audit --format=text || echo "::warning::Known vulnerabilities found, please review"
          else
            composer audit
          fi

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, sqlite3, pdo_mysql
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit with Coverage
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-clover coverage.xml

      - name: Upload Coverage to Codecov
        if: matrix.php == '8.2'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true