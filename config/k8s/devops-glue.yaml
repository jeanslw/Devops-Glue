# ══════════════════════════════════════════════════════════════════════════
# Devops-Glue Kubernetes 部署清单（k8s 兼容，与 docker-compose.yml 一一对应）
#
# 用法（全量一次性应用，Namespace 会自动创建）：
#   kubectl apply -f config/k8s/devops-glue.yaml
#
# 组件拓扑（对应 docker-compose 的分布式结构）：
#   devops-glue-lb  (front nginx, LoadBalancer)  ← 唯一对外入口
#         │  upstream → devops-glue Service（ClusterIP，轮询）
#         ▼
#   devops-glue       Deployment，副本数 replicas=3（web，无状态，可水平扩展）
#   devops-glue-worker Deployment，副本数 replicas=1（定时任务，单实例化）
#   devops-glue-mysql （可选，见末尾注释块；生产建议托管/独立 MySQL）
#
# 与 docker-compose 的关键差异（务必读）：
#   1) 无 PHP session：登录 token / API token 全在 MySQL，web 副本无需粘滞（ip_hash）。
#   2) 无宿主机 bind mount：/data 下日志、GitLab ID 缓存等改为 Pod 临时层（重启即清，
#      仅缓存性质，安全）；SQLite 库/备份需持久化时用末尾可选 PVC。
#   3) OIDC 私钥：多副本必须注入「固定」OIDC_RSA_PRIVATE_KEY（见下方 Secret），
#      否则每个副本自动生成不同私钥 → kid/JWKS 漂移 → Jenkins/Harbor/GitLab SSO 抽风。
#   4) 镜像：devops-glue:latest 需先 push 到集群可达的镜像仓库；私有仓库加 imagePullSecrets。
# ══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: devops-glue
---
# ──────────────────────────────────────────────────────────────────────────
# 应用配置 Secret —— 挂载到 /app/config/app.env，等价于 docker-compose 的
# bind mount `./config/app.env:/app/config/app.env:ro`。
#
# 更省事的替代做法（二选一，二者等价）：直接拿现有文件建 Secret，删掉本段 stringData 即可：
#   kubectl -n devops-glue create secret generic devops-glue-app-env \
#     --from-file=app.env=config/app.env
#
# ⚠️ OIDC_RSA_PRIVATE_KEY：生产多副本必须固定（openssl genrsa 2048 生成后写死，
#    多行 PEM 用 \n 转义或直接换行）。留空 = 每副本自动生成不同私钥，SSO 会坏。
# ⚠️ TRUSTED_PROXY_HOPS 必须 =1（前面有 front-nginx 一层反代，否则真实客户端 IP 丢失）。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: devops-glue-app-env
  namespace: devops-glue
type: Opaque
stringData:
  app.env: |
    APP_ENV=production
    APP_DEBUG=false
    # 对外可达的完整 URL（Swagger/OIDC issuer 等使用）
    API_BASE_URL=https://glue.example.com
    OIDC_ISSUER=https://glue.example.com

    # 构建模式：已启用 CI 源集合（首次运行种子，后台「配置模式」写入 DB 后以此为准）
    BUILD_MODE=jenkins,gitlab_ci,gitea_ci

    # ── 数据库（k8s 建议托管/独立 MySQL；DB_HOST 指向其地址/Service）──
    DB_DRIVER=mysql
    DB_HOST=devops-glue-mysql
    DB_PORT=3306
    DB_NAME=devops_glue
    DB_USER=devops
    DB_PASS=CHANGE_ME_DB_PASS

    # ── Jenkins / Harbor / Git 多平台（按需填写，未用的留空）──
    JENKINS_BASE_URL=http://your-jenkins:8080
    JENKINS_USER=admin
    JENKINS_TOKEN=CHANGE_ME
    HARBOR_BASE_URL=http://your-harbor
    HARBOR_USER=admin
    HARBOR_PASSWORD=CHANGE_ME
    GITLAB_BASE_URL=http://your-gitlab
    GITLAB_TOKEN=CHANGE_ME
    GITHUB_BASE_URL=https://api.github.com
    GITHUB_TOKEN=
    GITEE_BASE_URL=https://gitee.com/api/v5
    GITEE_TOKEN=
    GITEA_BASE_URL=https://your-gitea
    GITEA_TOKEN=

    # ── 管理后台种子账号（仅首启建号，之后后台修改）──
    ADMIN_USER=admin
    ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASS

    # 前端反代一层，必须 =1
    TRUSTED_PROXY_HOPS=1

    # ── OIDC SSO 签名私钥（多副本必须固定，见文件头 ⚠️）──
    OIDC_RSA_PRIVATE_KEY=CHANGE_ME_FIXED_RSA_PEM
---
# ──────────────────────────────────────────────────────────────────────────
# 定时任务 worker 的 supervisord 配置（覆盖镜像内置的 supervisord.conf）。
# 只跑 tag 清理 / 回填两个 sleep-loop CLI；以 www-data 运行避免 root 抢先建库污染属主。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-glue-worker-supervisord
  namespace: devops-glue
data:
  supervisord.conf: |
    [supervisord]
    logfile=/dev/null
    logfile_maxbytes=0
    pidfile=/run/supervisord.pid
    user=root

    [unix_http_server]
    file=/var/run/supervisor.sock
    chmod=0700

    [supervisorctl]
    serverurl=unix:///var/run/supervisor.sock

    [rpcinterface:supervisor]
    supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

    [program:tag-cleanup]
    command=/bin/sh -c 'trap "exit 0" TERM; while true; do php /app/cli/cleanup-pipeline-tags.php; sleep "${TAG_CLEANUP_INTERVAL:-3600}"; done'
    user=www-data
    autostart=true
    autorestart=true
    stdout_logfile=/dev/stdout
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/stderr
    stderr_logfile_maxbytes=0

    [program:tag-backfill]
    command=/bin/sh -c 'trap "exit 0" TERM; while true; do php /app/cli/backfill-pipeline-tags.php; sleep "${TAG_BACKFILL_INTERVAL:-1800}"; done'
    user=www-data
    autostart=true
    autorestart=true
    stdout_logfile=/dev/stdout
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/stderr
    stderr_logfile_maxbytes=0
---
# ──────────────────────────────────────────────────────────────────────────
# 前端负载均衡 nginx 配置（对应 config/docker/nginx-lb.conf）。
# upstream 指向 k8s Service `devops-glue`（同 namespace 短名可解析）。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-glue-lb
  namespace: devops-glue
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream glue_backend {
        # 默认轮询；应用无 PHP session，无需 ip_hash 粘滞。
        server devops-glue:80;
    }

    server {
        listen 80 default_server;
        server_name _;
        server_tokens off;

        client_max_body_size 50M;

        location / {
            proxy_pass http://glue_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
---
# ──────────────────────────────────────────────────────────────────────────
# Web 无状态 Deployment（水平扩展：改 replicas 即可，无 session 无需粘滞）
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-glue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devops-glue
    spec:
      # 镜像需先 push 到集群可达仓库；私有仓库在此加 imagePullSecrets。
      # imagePullSecrets:
      #   - name: registry-secret
      containers:
        - name: devops-glue
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # 应用配置（等价 compose 的 config/app.env bind mount）
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
          # 与 docker-compose healthcheck 一致：nginx 80 端口可连 + php-fpm socket 存在
          readinessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);' && test -S /run/php/php-fpm.sock"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);' && test -S /run/php/php-fpm.sock"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
---
# Web 内部 Service（供 front-nginx upstream 轮询）
apiVersion: v1
kind: Service
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  type: ClusterIP
  selector:
    app: devops-glue
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ──────────────────────────────────────────────────────────────────────────
# 定时任务 worker Deployment（单副本；CLI 内部数据库租约锁保证即使误起多份也只一份执行）
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-worker
  namespace: devops-glue
  labels:
    app: devops-glue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-worker
  template:
    metadata:
      labels:
        app: devops-glue-worker
    spec:
      containers:
        - name: devops-glue-worker
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
            # 用 worker 版 supervisord 覆盖镜像内置的（含 tag-cleanup/tag-backfill）
            - name: worker-supervisord
              mountPath: /etc/supervisor/conf.d/supervisord.conf
              subPath: supervisord.conf
              readOnly: true
          # worker 不监听端口；supervisord autorestart 已兜底崩溃重启，无需 liveness
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
        - name: worker-supervisord
          configMap:
            name: devops-glue-worker-supervisord
---
# ──────────────────────────────────────────────────────────────────────────
# 前端负载均衡（唯一对外入口）—— front-nginx，对应 docker-compose 的 front-nginx
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-lb
  template:
    metadata:
      labels:
        app: devops-glue-lb
    spec:
      containers:
        - name: nginx-lb
          image: nginx:1.22-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: lb-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
      volumes:
        - name: lb-conf
          configMap:
            name: devops-glue-lb
---
# 对外入口 Service：LoadBalancer（云）或 NodePort（裸机）。二选一，删掉不用的。
apiVersion: v1
kind: Service
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  type: LoadBalancer
  selector:
    app: devops-glue-lb
  ports:
    - name: http
      port: 80
      targetPort: http
  # 裸机无 LoadBalancer 时，改用 NodePort：
  # type: NodePort
  # ports:
  #   - name: http
  #     port: 80
  #     targetPort: http
  #     nodePort: 30080
---
