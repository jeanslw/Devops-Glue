---
# ══════════════════════════════════════════════════════════════════════════
# 可选：共享备份 / SQLite 持久卷（RWX，需支持 ReadWriteMany 的 StorageClass，
# 如 NFS/EFS/Ceph）。仅当需要「跨副本共享 /data/backups」或「SQLite 模式（DB_DRIVER=sqlite）」
# 时启用；MySQL + 注入 OIDC 私钥的默认拓扑下不需要。
# 启用后，把下面 volumeMounts 追加到 web/worker 的 containers：
#   - name: glue-data
#     mountPath: /data/backups
#     subPath: backups
#   # SQLite 模式再追加： mountPath: /data/db, subPath: db
# ══════════════════════════════════════════════════════════════════════════
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: devops-glue-data
#   namespace: devops-glue
# spec:
#   accessModes: ["ReadWriteMany"]
#   resources:
#     requests:
#       storage: 10Gi
#   # 显式指定支持 RWX 的 StorageClass：
#   # storageClassName: nfs
