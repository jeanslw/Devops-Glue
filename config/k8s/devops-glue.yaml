# ══════════════════════════════════════════════════════════════════════════
# Devops-Glue Kubernetes 部署清单
#
# 用法：
#   kubectl apply -f config/k8s/devops-glue.yaml
#
# 与 docker-compose 的关键差异（务必读）：
#   1) 无 PHP session：登录 token / API token 全在 MySQL，web 副本无需粘滞（ip_hash）。
#   2) 无宿主机 bind mount：/data 下日志、GitLab ID 缓存等改为 Pod 临时层；
#      SQLite 库/备份需持久化时用末尾可选 PVC。
#   3) OIDC 私钥：多副本必须注入「固定」OIDC_RSA_PRIVATE_KEY
# ══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: devops-glue
---
# ──────────────────────────────────────────────────────────────────────────
# 应用配置 Secret —— 挂载到 /app/config/app.env
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: devops-glue-app-env
  namespace: devops-glue
type: Opaque
stringData:
  app.env: |
    APP_ENV=production
    APP_DEBUG=false
    API_BASE_URL=https://glue.example.com

    BUILD_MODE=jenkins,gitlab_ci,gitea_ci
    DB_DRIVER=mysql
    DB_HOST=devops-glue-mysql
    DB_PORT=3306
    DB_NAME=devops_glue
    DB_USER=devops
    DB_PASS=CHANGE_ME_DB_PASS
    ADMIN_USER=admin
    ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASS
    TRUSTED_PROXY_HOPS=0

    # ── 敏感字段加密密钥 ──
    # base64 编码的 32 字节，生成：php -r "echo base64_encode(random_bytes(32));"
    DATA_ENC_KEY=CHANGE_ME_DATA_ENC_KEY

    # ── OIDC SSO 签名私钥 ──
    OIDC_RSA_PRIVATE_KEY=CHANGE_ME_FIXED_RSA_PEM
---
# ──────────────────────────────────────────────────────────────────────────
# 前端入口 nginx 配置
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-glue-lb
  namespace: devops-glue
data:
  default.conf: |
    upstream glue_php {
        server devops-glue:9000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        server_tokens off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        root /app/public;
        index index.php;
        charset utf-8;
        client_max_body_size 50M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass glue_php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_read_timeout 300;
        }

        location ~* \.(css|js)$ {
            access_log off;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
---
# ──────────────────────────────────────────────────────────────────────────
# Web 无状态 Deployment
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-glue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devops-glue
    spec:
      # imagePullSecrets:
      #   - name: registry-secret
      containers:
        - name: devops-glue
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: fpm
              containerPort: 9000
          volumeMounts:
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
---
apiVersion: v1
kind: Service
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  type: ClusterIP
  selector:
    app: devops-glue
  ports:
    - name: fpm
      port: 9000
      targetPort: fpm
---
# ──────────────────────────────────────────────────────────────────────────
# 定时任务 worker Deployment（单副本；CLI 内部数据库租约锁保证即使误起多份也只一份执行）
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-worker
  namespace: devops-glue
  labels:
    app: devops-glue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-worker
  template:
    metadata:
      labels:
        app: devops-glue-worker
    spec:
      containers:
        - name: devops-glue-worker
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          command: ["supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
---
# ──────────────────────────────────────────────────────────────────────────
# 前端入口
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-lb
  template:
    metadata:
      labels:
        app: devops-glue-lb
    spec:
      initContainers:
        - name: copy-static
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /app/public/. /static/"]
          volumeMounts:
            - name: static
              mountPath: /static
      containers:
        - name: nginx-lb
          image: nginx:1.22-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: lb-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: static
              mountPath: /app/public
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
      volumes:
        - name: lb-conf
          configMap:
            name: devops-glue-lb
        - name: static
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  type: LoadBalancer
  selector:
    app: devops-glue-lb
  ports:
    - name: http
      port: 80
      targetPort: http
  # type: NodePort
  # ports:
  #   - name: http
  #     port: 80
  #     targetPort: http
  #     nodePort: 30080
---
