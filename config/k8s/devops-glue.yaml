# ══════════════════════════════════════════════════════════════════════════
# Devops-Glue Kubernetes 部署清单（k8s 兼容，与 docker-compose.yml 一一对应）
#
# 用法（全量一次性应用，Namespace 会自动创建）：
#   kubectl apply -f config/k8s/devops-glue.yaml
#
# 组件拓扑（对应 docker-compose 的分布式拆分结构）：
#   devops-glue-lb  (nginx, LoadBalancer)  ← 唯一对外 HTTP 入口
#         │  静态文件直接返回（initContainer 从镜像拷贝 public/ 到 emptyDir）；
#         │  PHP 请求 fastcgi → devops-glue Service（ClusterIP，轮询，:9000）
#         ▼
#   devops-glue       Deployment，副本数 replicas=3（web，纯 php-fpm，无状态，可水平扩展）
#   devops-glue-worker Deployment，副本数 replicas=1（定时任务，单实例化）
#   devops-glue-mysql （可选，见末尾注释块；生产建议托管/独立 MySQL）
#
# 与 docker-compose 的关键差异（务必读）：
#   1) 无 PHP session：登录 token / API token 全在 MySQL，web 副本无需粘滞（ip_hash）。
#   2) 无宿主机 bind mount：/data 下日志、GitLab ID 缓存等改为 Pod 临时层（重启即清，
#      仅缓存性质，安全）；SQLite 库/备份需持久化时用末尾可选 PVC。
#   3) OIDC 私钥：多副本必须注入「固定」OIDC_RSA_PRIVATE_KEY（见下方 Secret），
#      否则每个副本自动生成不同私钥 → kid/JWKS 漂移 → Jenkins/Harbor/GitLab SSO 抽风。
#   4) 镜像：devops-glue:latest 需先 push 到集群可达的镜像仓库；私有仓库加 imagePullSecrets。
#   5) 静态文件：k8s 无宿主机 bind mount，改为 LB 的 initContainer 把镜像内 public/
#      拷到 emptyDir 供 nginx 直接返回（见 devops-glue-lb Deployment）。
# ══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: devops-glue
---
# ──────────────────────────────────────────────────────────────────────────
# 应用配置 Secret —— 挂载到 /app/config/app.env，等价于 docker-compose 的
# bind mount `./config/app.env:/app/config/app.env:ro`。
#
# 更省事的替代做法（二选一，二者等价）：直接拿现有文件建 Secret，删掉本段 stringData 即可：
#   kubectl -n devops-glue create secret generic devops-glue-app-env \
#     --from-file=app.env=config/app.env
#
# ⚠️ OIDC_RSA_PRIVATE_KEY：生产多副本必须固定（openssl genrsa 2048 生成后写死，
#    多行 PEM 用 \n 转义或直接换行）。留空 = 每副本自动生成不同私钥，SSO 会坏。
# ⚠️ DATA_ENC_KEY：敏感字段对称加密密钥（必填，缺失即 fail-closed）。本 Secret 同时
#    挂载到 web（replicas=3）与 worker 两个 Deployment，全部 Pod 读到同一值——这是
#    「多副本同 key」的唯一保证；换值/丢值 = 库内 token/secret 密文永久不可解。
# ⚠️ TRUSTED_PROXY_HOPS 默认 0：LB 用 fastcgi_pass 直连 php-fpm，REMOTE_ADDR 即客户端 IP，
#    无 X-Forwarded-For 跳。仅当 LB 之前还隔着不保留源 IP 的反代/云 LB 时，才按层数递增，
#    并需同步在 LB 的 nginx 配置里补 `fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;`。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: devops-glue-app-env
  namespace: devops-glue
type: Opaque
stringData:
  app.env: |
    APP_ENV=production
    APP_DEBUG=false
    # 对外可达的完整 URL（Swagger 等使用）
    API_BASE_URL=https://glue.example.com

    # 构建模式：已启用 CI 源集合（首次运行种子，后台「配置模式」写入 DB 后以此为准）
    BUILD_MODE=jenkins,gitlab_ci,gitea_ci

    # ── 数据库（k8s 建议托管/独立 MySQL；DB_HOST 指向其地址/Service）──
    DB_DRIVER=mysql
    DB_HOST=devops-glue-mysql
    DB_PORT=3306
    DB_NAME=devops_glue
    DB_USER=devops
    DB_PASS=CHANGE_ME_DB_PASS

    # ── Jenkins / Harbor / Git 多平台连接已迁入 DB（ci_platform_connections）──
    # 升级时手动跑一次 cli/migrate-platform-connections.php 搬库，或后台「平台接入状态」页配置；
    # 此处不再通过 env 注入。

    # ── 管理后台种子账号（仅首启建号，之后后台修改）──
    ADMIN_USER=admin
    ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASS

    # 反代跳数：LB 用 fastcgi_pass（非 proxy_pass），REMOTE_ADDR 直达客户端 IP，故默认 0。
    # 仅当 LB 前还有不保留源 IP 的云反代/代理协议时按层数递增（见文件头 ⚠️）。
    TRUSTED_PROXY_HOPS=0

    # ── 敏感字段加密密钥（必填，多副本必须同值，见上方 Secret 头 ⚠️）──
    # base64 编码的 32 字节，生成：php -r "echo base64_encode(random_bytes(32));"
    # 本 Secret 同时挂载到 web 与 worker，全部 Pod 读到同一值；务必备份、不进 git。
    DATA_ENC_KEY=CHANGE_ME_DATA_ENC_KEY

    # ── OIDC SSO 签名私钥（多副本必须固定，见文件头 ⚠️）──
    OIDC_RSA_PRIVATE_KEY=CHANGE_ME_FIXED_RSA_PEM
---
# ──────────────────────────────────────────────────────────────────────────
# 前端入口 nginx 配置（对应 config/docker/nginx.conf，仅 upstream 指向 k8s Service）。
#   - 静态文件（root /app/public）由 emptyDir 提供（initContainer 从镜像拷贝）；
#   - PHP 请求 fastcgi_pass → devops-glue:9000（web 纯 php-fpm）。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-glue-lb
  namespace: devops-glue
data:
  default.conf: |
    upstream glue_php {
        server devops-glue:9000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        server_tokens off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        root /app/public;
        index index.php;
        charset utf-8;
        client_max_body_size 50M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass glue_php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_read_timeout 300;
        }

        location ~* \.(css|js)$ {
            access_log off;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
---
# ──────────────────────────────────────────────────────────────────────────
# Web 无状态 Deployment（纯 php-fpm，水平扩展：改 replicas 即可，无 session 无需粘滞）
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-glue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devops-glue
    spec:
      # 镜像需先 push 到集群可达仓库；私有仓库在此加 imagePullSecrets。
      # imagePullSecrets:
      #   - name: registry-secret
      containers:
        - name: devops-glue
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: fpm
              containerPort: 9000
          volumeMounts:
            # 应用配置（等价 compose 的 config/app.env bind mount）
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
          # 与 docker-compose healthcheck 一致：php-fpm 在容器内 TCP 9000 可连接
          readinessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
---
# Web 内部 Service（供 LB fastcgi_pass 轮询；9000 是 FastCGI 协议，非 HTTP，不能对外暴露）
apiVersion: v1
kind: Service
metadata:
  name: devops-glue
  namespace: devops-glue
  labels:
    app: devops-glue
spec:
  type: ClusterIP
  selector:
    app: devops-glue
  ports:
    - name: fpm
      port: 9000
      targetPort: fpm
---
# ──────────────────────────────────────────────────────────────────────────
# 定时任务 worker Deployment（单副本；CLI 内部数据库租约锁保证即使误起多份也只一份执行）
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-worker
  namespace: devops-glue
  labels:
    app: devops-glue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-worker
  template:
    metadata:
      labels:
        app: devops-glue-worker
    spec:
      containers:
        - name: devops-glue-worker
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          # 覆盖镜像默认 CMD（php-fpm）→ supervisord 跑 cron 循环（镜像内置 supervisord-worker.conf，
          # 含 tag-cleanup / tag-backfill / api-log-cleanup / db-backup 四个 sleep-loop）。
          command: ["supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: app-env
              mountPath: /app/config/app.env
              subPath: app.env
              readOnly: true
          # worker 不监听端口；supervisord autorestart 已兜底崩溃重启，无需 liveness
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app-env
          secret:
            secretName: devops-glue-app-env
---
# ──────────────────────────────────────────────────────────────────────────
# 前端入口（唯一对外）—— nginx，对应 docker-compose 的 nginx 服务
# initContainer 从 devops-glue 镜像拷贝 public/ 到 emptyDir，供 nginx 直接返回静态文件；
# PHP 请求则 fastcgi 转发到 web（devops-glue Service）。
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-glue-lb
  template:
    metadata:
      labels:
        app: devops-glue-lb
    spec:
      initContainers:
        # 把镜像内 public/（含 index.php 与静态资源）拷到共享 emptyDir。
        # 与镜像同版本：升级时先 push 新镜像，initContainer 自动用新 public/。
        - name: copy-static
          image: devops-glue:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /app/public/. /static/"]
          volumeMounts:
            - name: static
              mountPath: /static
      containers:
        - name: nginx-lb
          image: nginx:1.22-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: lb-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: static
              mountPath: /app/public
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
      volumes:
        - name: lb-conf
          configMap:
            name: devops-glue-lb
        - name: static
          emptyDir: {}
---
# 对外入口 Service：LoadBalancer（云）或 NodePort（裸机）。二选一，删掉不用的。
apiVersion: v1
kind: Service
metadata:
  name: devops-glue-lb
  namespace: devops-glue
  labels:
    app: devops-glue-lb
spec:
  type: LoadBalancer
  selector:
    app: devops-glue-lb
  ports:
    - name: http
      port: 80
      targetPort: http
  # 裸机无 LoadBalancer 时，改用 NodePort：
  # type: NodePort
  # ports:
  #   - name: http
  #     port: 80
  #     targetPort: http
  #     nodePort: 30080
---
# ══════════════════════════════════════════════════════════════════════════
