# 可选：共享备份 / SQLite 持久卷（RWX，需支持 ReadWriteMany 的 StorageClass，
# 如 NFS/EFS/Ceph）。仅当需要「跨副本共享 /data/backups」或「SQLite 模式（DB_DRIVER=sqlite）」
# 时启用；MySQL + 注入 OIDC 私钥的默认拓扑下不需要。
# 启用后，把下面 volumeMounts 追加到 web/worker 的 containers：
