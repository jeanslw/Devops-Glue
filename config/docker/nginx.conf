server {
    listen 80 default_server;
    server_name _;

    # 隐藏 nginx 版本号（响应头只显示 Server: nginx）
    server_tokens off;

    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== HTTPS/HTTP2（想启用：去掉本段注释；证书放到宿主机 config/certs/；
    #      并在 docker-compose.yml 放开 certs 挂载与 443 端口两行注释）=====
    # ===== HTTPS/HTTP2 (To enable: uncomment this block, place certs in config/certs/
    #      on the host, and uncomment the certs mount + 443 port lines in docker-compose.yml) =====
    #listen 443 ssl http2 default_server;
    #listen [::]:443 ssl http2 default_server;
    # 注：nginx >= 1.25.1 推荐改用独立指令 `http2 on;`（listen 行写 ssl 即可）；
    #     本镜像（Debian bookworm, nginx 1.22）用 listen ... http2 兼容写法。
    #ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # 只允许 TLSv1.2/1.3（禁用已退役的 TLSv1.0/1.1 与不安全的 SSLv3）
    #ssl_protocols TLSv1.2 TLSv1.3;
    # 前向保密套件（ECDHE 优先；TLSv1.3 套件由 OpenSSL 内置，不受此项影响）
    #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    #ssl_prefer_server_ciphers off;
    # 会话复用（10m 缓存约 4 万会话；关闭 session ticket 降低前向泄露风险）
    #ssl_session_cache shared:SSL:10m;
    #ssl_session_timeout 1d;
    #ssl_session_tickets off;
    # 密钥交换参数（2048 位以上；自签/内部 CA 可用 `openssl dhparam -out /etc/nginx/certs/dhparam.pem 2048` 生成后放开）
    #ssl_dhparam /etc/nginx/certs/dhparam.pem;
    # 启用后浏览器强制 HTTPS（max-age 单位秒；确认 HTTPS 稳定后再开，开了难回退）
    #add_header Strict-Transport-Security "max-age=31536000" always;
}