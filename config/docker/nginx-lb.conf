# Devops-Glue 前端负载均衡（多 web 副本统一入口）。
# 挂载位置：/etc/nginx/conf.d/default.conf（见 docker-compose.yml 的 front-nginx 服务）。
# 扩副本：在 upstream 里按需放开/新增 server 行，与 docker-compose 里的 web 服务一一对应。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream glue_backend {
    # 默认轮询。应用无 PHP session（登录 token / API token 全在 MySQL），无需 ip_hash 粘滞。
    server devops-glue:80;
    # server devops-glue-web-2:80;   # 再加副本时取消注释（并同步在 docker-compose 添加对应服务）
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 50M;

    location / {
        proxy_pass http://glue_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE 升级透传（应用如需实时日志流）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 关缓冲，便于长连接/流式日志即时下发；纯 API 场景可改回默认 buffering on。
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
