[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 每小时清理一次过期 tag（以 Harbor 为准）。CLI 内部受后台开关 stale_tag_cleanup_enabled 控制：
; 未开启时打印跳过并退出 0，不做任何删除。sleep-loop 避免额外安装 cron。
; ⚠️ 必须以 www-data 运行：默认 root 身份会抢先创建 root 属主的 SQLite 库文件，导致 php-fpm（www-data）写入错误
;以 www-data 运行后，与 Web 侧属主一致，库文件不会被 root 污染。
[program:tag-cleanup]
command=/bin/sh -c 'trap "exit 0" TERM; while true; do php /app/cli/cleanup-pipeline-tags.php; sleep 3600; done'
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0