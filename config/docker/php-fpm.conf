[www]
; TCP 监听：供独立 nginx 容器 fastcgi_pass 连接
listen = 0.0.0.0:9000
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
php_admin_flag[expose_php] = Off

; PHP 引擎层原生错误日志
php_admin_value[error_log] = /dev/stderr
catch_workers_output = yes
