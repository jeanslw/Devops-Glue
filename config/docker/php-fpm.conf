[www]
; 与 nginx.conf 中的 socket 路径一致
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 保留环境变量（关键！否则 .env 注入失效）
clear_env = no

; 性能调优
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; 隐藏 PHP 版本（去掉响应头 X-Powered-By: PHP/8.x）
php_admin_flag[expose_php] = Off

; PHP 引擎层原生错误日志（warning/notice/fatal/Xdebug 等），独立落盘到 /data/logs/php_log，
; 与应用业务日志 app-*.log（LOG_PATH=/data/logs/ci-platform）分开。避免全走容器 stdout/docker logs。
; 注意：php_admin_value 设置的是每个 pool 的 error_log；entrypoint.sh 已预建目录并授权 www-data。
php_admin_value[error_log] = /data/logs/php_log/php-error.log
; 把 worker 捕获到的 stdout/stderr 也并入上方 error_log，便于统一追溯未捕获输出
catch_workers_output = yes